{% extends "base.html" %}
{% load static %}

{% block title %}Server error — SyncChat{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/errors.css' %}" />
{% endblock %}

{% block content %}
<main class="error-card">
  <div class="error-code">500</div>
  <h1>Something went wrong</h1>
  <p>An unexpected error occurred. Please try again in a moment.</p>
  <a class="btn btn-primary" href="{% url 'dashboard' %}">Back to Messages</a>
</main>
{% endblock %}
