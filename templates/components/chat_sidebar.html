         stroke-linecap="round"
         stroke-linejoin="round">

        <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/>
        <circle cx="9.5" cy="7" r="3"/>

        <!-- Plus -->
        <path d="M19 8v6"/>
        <path d="M16 11h6"/>
    </svg>
</button>
      <div class="search-wrap">

  <!-- New Chat Modal -->
  <div class="modal-overlay" id="new-chat-modal" hidden>
    <div class="modal-container">
      <div class="modal-header">
        <h2 class="modal-title">New Chat</h2>
        <button class="icon-btn" id="close-modal-btn" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M21 21l-4.3-4.3"/>
          </svg>
          <input type="search" id="modal-search" placeholder="Search users..." aria-label="Search users" autocomplete="off" />
        </div>
        <div class="modal-section" id="recent-users-section">
          <div class="modal-section-title">Recent</div>
          <div class="modal-user-list" id="recent-users-list"></div>
        </div>
        <div class="modal-section" id="suggested-users-section">
          <div class="modal-section-title">Suggested</div>
          <div class="modal-user-list" id="suggested-users-list"></div>
        </div>
        <div class="modal-section" id="search-results-section" hidden>
          <div class="modal-section-title">Search Results</div>
          <div class="modal-user-list" id="search-results-list"></div>
        </div>
        <div class="modal-empty" id="modal-empty" hidden>No users found.</div>
      </div>
    </div>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="modal-overlay" id="logout-modal" hidden>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <h2 class="modal-title">Confirm Logout</h2>
      </div>
      <div class="modal-body">
        <p style="margin: 0; color: var(--text-secondary);">Are you sure you want to logout?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="logout-cancel-btn">Cancel</button>
        <button type="button" class="btn btn-danger" id="logout-confirm-btn">Logout</button>
      </div>
    </div>
  </div>

  <!-- Block Confirmation Modal -->
  <div class="modal-overlay" id="block-modal" hidden>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <h2 class="modal-title">Block User</h2>
      </div>
      <div class="modal-body">
        <p style="margin: 0; color: var(--text-secondary);" id="block-modal-text"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="block-cancel-btn">Cancel</button>
        <button type="button" class="btn btn-danger" id="block-confirm-btn">Block</button>
      </div>
    </div>
  </div>

  <!-- Delete Conversation Confirmation Modal -->
  <div class="modal-overlay" id="delete-modal" hidden>
    <div class="modal-container modal-small">
      <div class="modal-header">
        <h2 class="modal-title">Delete Conversation</h2>
      </div>
      <div class="modal-body">
        <p style="margin: 0; color: var(--text-secondary);" id="delete-modal-text"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="delete-cancel-btn">Cancel</button>
        <button type="button" class="btn btn-danger" id="delete-confirm-btn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Image Viewer Modal -->
  <div class="image-viewer-overlay" id="image-viewer" hidden>
    <div class="image-viewer-header">
      <button class="image-viewer-btn" id="image-close-btn" aria-label="Close image viewer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="image-viewer-body">
      <button class="image-nav-btn image-prev-btn" id="image-prev-btn" aria-label="Previous image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="image-viewer-content">
        <img id="image-viewer-img" src="" alt="Full size image" />
      </div>
      <button class="image-nav-btn image-next-btn" id="image-next-btn" aria-label="Next image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>
    <div class="image-viewer-controls">
      <button class="image-viewer-btn" id="image-zoom-out-btn" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>
          <path d="M8 11h6"/>
        </svg>
      </button>
      <span class="image-zoom-level" id="image-zoom-level">100%</span>
      <button class="image-viewer-btn" id="image-zoom-in-btn" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>
          <path d="M11 8v6M8 11h6"/>
        </svg>
      </button>
      <button class="image-viewer-btn" id="image-reset-btn" aria-label="Reset zoom">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.2-8.5"/>
          <path d="M21 3v9h-9"/>
        </svg>
      </button>
    </div>
    <div class="image-counter" id="image-counter" hidden>
      <span id="image-current">1</span> / <span id="image-total">1</span>
    </div>
  </div>
