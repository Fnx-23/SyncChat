    <div class="chat-head">
      <button class="icon-btn back-btn" id="back-btn" aria-label="Back to conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <span class="avatar" id="chat-avatar"></span>
      <div class="chat-id">
        <div class="name" id="chat-name"></div>
        <div class="status" id="chat-status"><span class="dot"></span><span id="chat-status-text">Online</span></div>
        <div class="blocked-flag" id="chat-blocked-flag" hidden><span class="dot"></span><span>Blocked</span></div>
      </div>
      <button class="icon-btn" id="msg-search-btn" aria-label="Search messages" title="Search messages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>
        </svg>
      </button>
      <button class="icon-btn" id="info-btn" aria-label="Toggle profile panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 11v5"/>
          <path d="M12 8h.01"/>
        </svg>
      </button>
    </div>
    <div class="msg-search" id="msg-search" hidden>
      <input type="search" id="msg-search-input" placeholder="Search this conversation" aria-label="Search this conversation" autocomplete="off" />
      <button class="icon-btn" id="msg-search-clear" aria-label="Clear message search" title="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
