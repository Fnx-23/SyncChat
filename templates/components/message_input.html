    <div class="composer" id="composer">
      <div class="msg-preview" id="msg-preview" hidden>
        <img id="preview-img" alt="Attached image preview" />
        <button type="button" class="icon-btn" id="preview-remove" aria-label="Remove image" title="Remove image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="chat-input">
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" maxlength="4000" />
        <button type="button" class="icon-btn attach-btn" id="attach-btn" aria-label="Attach an image" title="Attach an image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="M21 15l-4.5-4.5L7 20"/>
          </svg>
        </button>
        <button class="send-btn" id="send-btn" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/>
            <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <input type="file" id="img-input" accept="image/jpeg,image/png,image/webp,image/gif" hidden />

      <!-- Instagram-style block action panel. Replaces the composer when the
           current user has blocked the other participant. -->
      <div class="block-panel" id="block-panel" hidden>
        <div class="block-panel-title">You've blocked this account.</div>
        <div class="block-panel-subtitle">You can't send messages until you unblock this user.</div>
        <div class="block-panel-actions">
          <button type="button" class="block-panel-unblock" id="block-panel-unblock-btn">Unblock</button>
          <button type="button" class="block-panel-delete" id="block-panel-delete-btn">Delete Chat</button>
        </div>
      </div>

      <!-- Restricted composer. Replaces the composer when the other user has
           blocked us: messaging is disabled and the conversation is frozen. -->
      <div class="restricted-panel" id="restricted-panel" hidden>
        <div class="restricted-panel-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
          </svg>
        </div>
        <div class="restricted-panel-title">You cannot message this user.</div>
        <div class="restricted-panel-subtitle">This conversation is unavailable.</div>
      </div>
    </div>
