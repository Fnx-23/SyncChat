  <!-- Right: profile & details -->
  <aside class="panel details" id="details">
    <div class="details-head">
      <button class="icon-btn" id="close-details" aria-label="Close profile panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Restricted profile shown when the other user has blocked us. The
         blocker's identity is hidden: no avatar, no name, no profile info. -->
    <div class="restricted-profile" id="restricted-profile" hidden>
      <div class="restricted-profile-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7" r="4"/>
          <path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>
        </svg>
      </div>
      <div class="restricted-profile-name">Unknown User</div>
      <div class="restricted-profile-text">This account is no longer available.</div>
      <div class="restricted-profile-text">You cannot send messages to this user.</div>
    </div>

    <!-- Profile Header -->
    <div class="profile-header" id="profile-header" hidden>
      <span class="avatar profile-avatar" id="profile-avatar"></span>
      <div class="profile-name" id="profile-name"></div>
      <div class="profile-handle" id="profile-handle"></div>
      <span class="profile-status-badge" id="profile-status-badge">
        <span class="status-dot"></span>
        <span class="status-text" id="profile-status-text">Offline</span>
      </span>
    </div>

    <!-- Status Section -->
    <div class="profile-section" id="status-section">
      <div class="section-label">Status</div>
      <div class="section-value" id="profile-status"></div>
    </div>

    <!-- Bio Section -->
    <div class="profile-section" id="bio-section" hidden>
      <div class="section-row">
        <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7" r="4"/>
          <path d="M5.5 21a6.5 6.5 0 0 1 13 0"/>
        </svg>
        <div class="section-content">
          <div class="section-label">Bio</div>
          <div class="section-value" id="profile-bio"></div>
        </div>
      </div>
    </div>

    <!-- Email Section -->
    <div class="profile-section" id="email-section" hidden>
      <div class="section-row">
        <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <div class="section-content">
          <div class="section-label">Email</div>
          <div class="section-value" id="profile-email"></div>
        </div>
      </div>
    </div>

    <!-- Joined Section -->
    <div class="profile-section" id="joined-section" hidden>
      <div class="section-row">
        <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <div class="section-content">
          <div class="section-label">Joined</div>
          <div class="section-value" id="profile-joined"></div>
        </div>
      </div>
    </div>

    <!-- Shared Media Section -->
    <div class="profile-section media-section" id="media-section" hidden>
      <div class="section-header">
        <div class="section-label">Shared Media</div>
        <button class="media-view-all" id="media-view-all" type="button" hidden>
          <span>View All</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
        <div class="section-count" id="media-count"></div>
      </div>
      <div class="media-grid" id="media-grid"></div>
    </div>

    <!-- Shared Files Section -->
    <div class="profile-section files-section" id="files-section" hidden>
      <div class="section-header">
        <div class="section-label">Shared Files</div>
        <div class="section-count" id="files-count">0</div>
      </div>
    </div>

    <!-- Shared Links Section -->
    <div class="profile-section links-section" id="links-section" hidden>
      <div class="section-header">
        <div class="section-label">Shared Links</div>
        <div class="section-count" id="links-count">0</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="profile-actions">
      <button class="action-btn action-mute" id="mute-btn" aria-label="Mute notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
        <span id="mute-btn-label">Mute</span>
      </button>
      <button class="action-btn action-block" id="block-btn" aria-label="Block user">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
        <span>Block</span>
      </button>
      <button class="action-btn action-delete" id="delete-conversation-btn" aria-label="Delete conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        <span>Delete Chat</span>
      </button>
    </div>
  </aside>
