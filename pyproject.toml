[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["syncchat", "accounts", "chat", "core"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
